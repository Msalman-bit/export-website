<title>Monolith Sports (preview)</title>
<script>
  // The preview of the Monolith Sports site runs on Render; this page sends visitors there and keeps the page
  // they asked for (msalman-bit.github.io/export-website/en/products opens /en/products on the preview).
  var SITE = 'https://monolith-sports.onrender.com';
  var BASE = '/export-website';
  var path = location.pathname.indexOf(BASE) === 0 ? location.pathname.slice(BASE.length) : location.pathname;
  location.replace(SITE + (path || '/') + location.search + location.hash);
</script>
<meta http-equiv="refresh" content="1; url=https://monolith-sports.onrender.com/">

  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b0b0c; color: #f2f2f2;

</style>
