# A one-click preview of the site on Render's free plan:
#   https://render.com/deploy?repo=https://github.com/Msalman-bit/export-website
# It is a preview, not the live shop:
#   - the site sleeps after 15 minutes without visitors; the next visit takes about a minute to wake it
#   - its data is in a free Render PostgreSQL database (kept while the site sleeps; Render's free databases expire
#     after about 30 days); files uploaded on it (logos, artwork) are not kept when it sleeps or updates
#   - it is hidden from search engines (SITE_NOINDEX)
#   - every push to main updates it
# The real site goes on the Hostinger VPS: deploy-kit/hostinger/HOSTINGER.md.
services:
  - type: web
    name: monolith-sports
    runtime: node
    plan: free
    region: frankfurt
    # the standalone server (lighter than next start, so it fits the free plan's 512 MB) needs the browser files
    # and the public folder beside it
    buildCommand: npm ci && npm run build && cp -r public .next/standalone/ && cp -r .next/static .next/standalone/.next/
    # the memory cap is for the running site only: the build (its type check) needs more and gets Render's default
    startCommand: node --max-old-space-size=320 .next/standalone/server.js
    healthCheckPath: /robots.txt
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      # replaces a memory cap that used to be set here, which also held back the build; the start command caps the
      # running site instead. (Render keeps a removed variable's old value, so it is overwritten, not just dropped.)
      - key: NODE_OPTIONS
        value: --no-deprecation
      # the database below, reached over Render's private network
      - key: DATABASE_URL
        fromDatabase:
          name: monolith-db
          property: connectionString
      - key: DATABASE_SSL
        value: disable
      # the site's encryption key: Render generates a random one
      - key: APP_SECRET
        generateValue: true
      # keep the preview out of Google and other search engines
      - key: SITE_NOINDEX
        value: "1"
      # the first administrator: Render asks you for these when you create the preview
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false

databases:
  - name: monolith-db
    plan: free
    region: frankfurt
    databaseName: monolith
    user: monolith
    # reachable only from Render's private network (the site above), never from the internet
    ipAllowList: []
