<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Monolith Sports email signature</title></head>
<body style="margin:24px;font-family:Arial,sans-serif">
<!-- Copy the table below into the email client's signature editor. Replace the name, role and
     contact line; host the monogram at https://<your domain>/brand/monogram.svg (PNG for Outlook). -->
<table role="presentation" cellpadding="0" cellspacing="0" style="border-collapse:collapse;font-family:Arial,Helvetica,sans-serif;color:#080808">
  <tr>
    <td style="padding:0 14px 0 0;vertical-align:top"><img src="https://www.monolithsports.example/brand/monogram.svg" width="44" height="44" alt="Monolith Sports" style="display:block;border-radius:8px"></td>
    <td style="vertical-align:top;border-left:3px solid #C5F900;padding:0 0 0 14px">
      <div style="font-size:15px;line-height:20px">Full Name</div>
      <div style="font-size:12px;line-height:18px;color:#5c5f63">Export sales · Monolith Sports</div>
      <div style="font-size:12px;line-height:18px;padding-top:6px"><a href="https://www.monolithsports.example/en/inquiry" style="color:#080808">Request a quote</a> · <a href="https://www.monolithsports.example" style="color:#080808">monolithsports.example</a></div>
    </td>
  </tr>
</table>
</body>
</html>
