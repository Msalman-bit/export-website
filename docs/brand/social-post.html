<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Monolith Sports social post template (1080 x 1350)</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..600&display=swap" rel="stylesheet">
<style>
  /* Open in Chrome, set the viewport to 1080 x 1350 and take a screenshot, or export with the skill's shoot.mjs.
     Swap the photograph and the two lines; keep one fact per post. */
  body { margin: 0; }
  .post { width: 1080px; height: 1350px; background: #080808; color: #fff; font-family: Archivo, Arial, sans-serif; position: relative; overflow: hidden; }
  .post img.photo { position: absolute; inset: 0 0 420px 0; width: 100%; height: 930px; object-fit: cover; }
  .post .band { position: absolute; left: 0; right: 0; bottom: 0; height: 420px; padding: 64px; box-sizing: border-box; display: grid; align-content: space-between; }
  .post h1 { margin: 0; font-weight: 400; font-stretch: 82%; font-size: 92px; line-height: .98; letter-spacing: -0.03em; }
  .post p { margin: 0; font-size: 30px; color: #c9ccd1; }
  .post .rule { position: absolute; left: 0; right: 0; top: 930px; height: 8px; background: #C5F900; }
  .post .logo { position: absolute; right: 64px; bottom: 64px; height: 48px; }
</style>
</head>
<body>
  <div class="post">
    <img class="photo" src="../../public/assets/img/gen/hero-football-phone-1080.webp" alt="">
    <div class="rule"></div>
    <div class="band">
      <h1>Footballs made<br>under your brand</h1>
      <p>Quotes in EUR, GBP or USD · Samples before bulk</p>
    </div>
    <img class="logo" src="../../public/brand/monogram.svg" alt="Monolith Sports">
  </div>
</body>
</html>
